<div class="dashboard-container">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <div class="text-section">
        <h1 class="hero-title">{{ firstName }}-{{ lastName }}</h1>
        <p class="hero-description">{{ description }}</p>
        <button class="cta-button" routerLink="/projects">
          Let's get started >
        </button>
      </div>
      
      <div class="photo-section">
        <img src="assets/img/photo.png" alt="Photo de profil" class="profile-photo">
      </div>
    </div>
  </section>

  <!-- Companies Section -->
  <section class="companies-section">
    <h2 class="companies-title">Travaillé avec</h2>
    <div class="companies-container">
      <a *ngFor="let company of companies" 
         [href]="company.url" 
         target="_blank" 
         class="company-link">
        {{ company.name }}
      </a>
    </div>
  </section>

  <!-- Contacts Section -->
  <section class="contacts-section">
    <h2 class="contacts-title">Me contacter</h2>
    <p class="contacts-description">Que ce soit pour une question, une opportunité de collaboration ou un simple bonjour, n'hésitez pas à me contacter !</p>
    
    <div class="contacts-container">
      <!-- Mon CV -->
      <div class="contact-card">
        <div class="contact-card-icon cv-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="13" x2="12" y2="19"/>
            <line x1="9" y1="16" x2="15" y2="16"/>
          </svg>
        </div>
        <a [href]="cvFile" download class="contact-card-title">Mon CV</a>
        <p class="contact-card-text">Télécharger</p>
      </div>

      <!-- Email -->
      <div class="contact-card">
        <div class="contact-card-icon email-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="4" width="20" height="16" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
        </div>
        <a [href]="'mailto:' + email" class="contact-card-title">Email</a>
        <p class="contact-card-text">{{ email }}</p>
      </div>

      <!-- LinkedIn -->
      <div class="contact-card">
        <div class="contact-card-icon linkedin-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6M2 9h4v12H2z"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </div>
        <a [href]="linkedinUrl" target="_blank" class="contact-card-title">LinkedIn</a>
        <p class="contact-card-text">{{ linkedinName }}</p>
      </div>
    </div>
  </section>
</div>
