<div class="dashboard-container">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <div class="text-section">
        <h1 class="hero-title">{{ firstName }} {{ lastName }}</h1>
        <p class="hero-description">{{ description }}</p>
      </div>
      
      <div class="photo-section">
        <img src="assets/img/photo.png" alt="Photo de profil" class="profile-photo">
      </div>
    </div>
  </section>

  <!-- Companies Section -->
  <section class="companies-section">
    <h2 class="companies-title">Travaillé avec</h2>
    <div class="companies-container">
      <a *ngFor="let company of companies" 
         [href]="company.url" 
         target="_blank" 
         class="company-link"
         [title]="company.name">
        <img [src]="company.logo" [alt]="company.name" class="company-logo-img">
      </a>
    </div>
  </section>
</div>
