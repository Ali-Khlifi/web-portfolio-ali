<div class="home-container">
  <section class="company-hero">
    <img
      class="company-logo"
      src="assets/img/kes-logo.png"
      alt="Logo KHLIFI ENGINEERING SERVICES"
    >

    <div class="company-divider" aria-hidden="true"></div>

    <div class="company-copy">
      <h1 class="company-title">
        <span class="brand-k">K</span>HLIFI
        <span class="brand-e">E</span>NGINEERING
        <span class="brand-s">S</span>ERVICES
      </h1>

      <p class="company-description">{{ description }}</p>

      <div class="company-actions">
        <a href="#contact" class="company-link-secondary" (click)="goToSection($event, 'contact')">Me contacter</a>

        <a
          class="company-icon-link"
          [href]="'mailto:' + email"
          aria-label="Envoyer un email"
          title="Email"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="m3 7 9 6 9-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a
          class="company-icon-link"
          [href]="linkedinUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Profil LinkedIn"
          title="LinkedIn"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6M2 9h4v12H2z"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </a>

        <a
          class="company-icon-link"
          [href]="githubUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Profil GitHub"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.48 0-.24-.01-.87-.01-1.7-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.7 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 7.1c.85 0 1.7.12 2.5.34 1.9-1.32 2.74-1.05 2.74-1.05.55 1.4.2 2.44.1 2.7.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.8 0 .27.18.59.69.49A10.03 10.03 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"
            />
          </svg>
        </a>

        <a
          class="company-icon-link"
          [href]="'tel:' + phone"
          [attr.aria-label]="'Appeler ' + phoneDisplay"
          [title]="phoneDisplay"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </div>
    </div>

    <div class="company-edge" aria-hidden="true"></div>
  </section>
</div>
