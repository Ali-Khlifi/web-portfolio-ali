<div class="contact-form-section">
  <h2 class="section-title">Envoyez-moi un Message</h2>
  
  <div class="success-message" *ngIf="successMessage">
    <div class="success-icon">✓</div>
    <p>Merci! Votre message a été reçu. Je vous répondrai très bientôt.</p>
  </div>

  <div class="error-message" *ngIf="errorMessage">
    <div class="error-icon">⚠</div>
    <p>Oups! Une erreur s'est produite. Veuillez réessayer ou m'envoyer un email directement.</p>
  </div>

  <form [ngClass]="{ 'form-submitted': submitted }" (ngSubmit)="submitForm()" #contactForm="ngForm">
    
    <div class="form-group">
      <label for="name" class="form-label">Nom *</label>
      <input 
        type="text" 
        id="name" 
        name="name"
        class="form-input"
        [class.error]="submitted && form.name.trim() === ''"
        [(ngModel)]="form.name"
        placeholder="Votre nom"
        [disabled]="isLoading">
      <span class="error-text" *ngIf="submitted && form.name.trim() === ''">Le nom est requis</span>
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Email *</label>
      <input 
        type="email" 
        id="email"
        name="email"
        class="form-input"
        [class.error]="submitted && form.email.trim() === ''"
        [(ngModel)]="form.email"
        placeholder="votre.email@exemple.com"
        [disabled]="isLoading">
      <span class="error-text" *ngIf="submitted && form.email.trim() === ''">L'email est requis</span>
    </div>

    <div class="form-group">
      <label for="subject" class="form-label">Sujet *</label>
      <input 
        type="text" 
        id="subject"
        name="subject"
        class="form-input"
        [class.error]="submitted && form.subject.trim() === ''"
        [(ngModel)]="form.subject"
        placeholder="Sujet de votre message"
        [disabled]="isLoading">
      <span class="error-text" *ngIf="submitted && form.subject.trim() === ''">Le sujet est requis</span>
    </div>

    <div class="form-group">
      <label for="message" class="form-label">Message *</label>
      <textarea 
        id="message"
        name="message"
        class="form-textarea"
        [class.error]="submitted && form.message.trim() === ''"
        [(ngModel)]="form.message"
        placeholder="Votre message..."
        rows="6"
        [disabled]="isLoading"></textarea>
      <span class="error-text" *ngIf="submitted && form.message.trim() === ''">Le message est requis</span>
    </div>

    <button type="submit" class="submit-button" [disabled]="isLoading">
      <span *ngIf="!isLoading">Envoyer le Message</span>
      <span *ngIf="isLoading">Envoi en cours...</span>
    </button>
  </form>
</div>
