<div class="contact-info-section">
  <div class="info-cards">
    <!-- Mon CV -->
    <a [href]="cvFile" download class="info-card">
      <div class="info-card-icon cv-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="13" x2="12" y2="19"/>
          <line x1="9" y1="16" x2="15" y2="16"/>
        </svg>
      </div>
      <p class="info-card-title">Mon CV</p>
      <p class="info-card-text">Télécharger</p>
    </a>

    <!-- Email -->
    <a [href]="'mailto:' + email" class="info-card">
      <div class="info-card-icon email-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="2" y="4" width="20" height="16" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
      </div>
      <p class="info-card-title">Email</p>
      <p class="info-card-text">{{ email }}</p>
    </a>

    <!-- LinkedIn -->
    <a [href]="linkedinUrl" target="_blank" class="info-card">
      <div class="info-card-icon linkedin-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6M2 9h4v12H2z"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
      </div>
      <p class="info-card-title">LinkedIn</p>
      <p class="info-card-text">{{ linkedinName }}</p>
    </a>
  </div>
</div>
